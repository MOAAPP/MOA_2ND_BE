name: World Agent backend regression tests

on:
  push:
    branches:
      - feat/world-agent
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-backend-tests:
    name: Python 3.12 full backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend requirements
        run: python -m pip install -r requirements.txt
      - name: Verify canonical synthetic fixture
        run: echo "9e2adc5a7aa7720ef8daf24f8766389233dee399c0ea0826f9dc3a90aaeab609  app/data/source/moa_20users_financial_test_JSON.zip" | sha256sum --check -
      - name: All pytest cases, including goal integration and existing endpoints
        run: python -m pytest -q
