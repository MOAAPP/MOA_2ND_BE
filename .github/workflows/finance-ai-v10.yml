name: Finance AI v10 backend quality
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/services/ai_quality.py'
      - 'app/services/ai_briefing.py'
      - 'app/services/learning_ai.py'
      - 'app/services/ai_provider.py'
      - 'tests/test_ai_quality_v10.py'
      - '.github/workflows/finance-ai-v10.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app/services/ai_quality.py app/services/ai_briefing.py app/services/learning_ai.py app/services/ai_provider.py
      - name: Verify language gates, data grounding, and API integration
        run: pytest -q tests/test_ai_quality_v10.py tests/test_ai_briefing_grounded_signals.py tests/test_ai_integration.py
