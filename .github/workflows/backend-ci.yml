name: V4 FastAPI backend verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original synthetic dataset and validate SHA-256
        env:
          SOURCE_URL: https://raw.githubusercontent.com/MOAAPP/MOA_2ND/73f4a9612fcd798bc86fe64a11550386cd84c83d/backend/app/data/source/moa_20users_financial_test_JSON.zip
        run: |
          set -eu
          mkdir -p app/data/source
          if [ ! -f app/data/source/moa_20users_financial_test_JSON.zip ]; then
            curl --fail --location --retry 3 "$SOURCE_URL" -o app/data/source/moa_20users_financial_test_JSON.zip
          fi
          echo "9e2adc5a7aa7720ef8daf24f8766389233dee399c0ea0826f9dc3a90aaeab609  app/data/source/moa_20users_financial_test_JSON.zip" | sha256sum --check -
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest -q
      - name: Commit original dataset to backend repository
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git ls-files --error-unmatch app/data/source/moa_20users_financial_test_JSON.zip > /dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f app/data/source/moa_20users_financial_test_JSON.zip
            git commit -m "data(v4): preserve original synthetic finance dataset"
            git push origin HEAD:main
          fi
