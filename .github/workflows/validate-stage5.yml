name: Stage 5 canonical dataset, agent search and 20-user evaluation
on:
  pull_request:
    paths:
      - 'app/api/agent.py'
      - 'app/services/agent_paths.py'
      - 'app/services/agent_llm.py'
      - 'tests/test_agent.py'
      - 'scripts/eval_stage5.py'
      - 'requirements.txt'
      - '.github/workflows/validate-stage5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    name: Finance-agent strict tests and 20-persona comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify unchanged canonical 20-user ZIP
        run: echo "9e2adc5a7aa7720ef8daf24f8766389233dee399c0ea0826f9dc3a90aaeab609  app/data/source/moa_20users_financial_test_JSON.zip" | sha256sum --check -
      - name: Run exact 20-persona API and agent tests
        run: python -m pytest -q tests/test_agent.py tests/test_stage3.py tests/test_ml.py
      - name: Compare fixed six worlds and actual constrained Python paths
        run: python -m scripts.eval_stage5 --output /tmp/stage5-evaluation.json
      - name: Upload evaluation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-synthetic-agent-evaluation
          path: /tmp/stage5-evaluation.json
          if-no-files-found: warn
