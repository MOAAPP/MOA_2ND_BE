name: Personal-input stateless finance preview tests
on:
  push:
    branches:
      - feat/personal-input-integration
    paths:
      - 'app/personal_models.py'
      - 'app/services/personal_cashflow.py'
      - 'app/api/personal.py'
      - 'app/main.py'
      - 'tests/test_personal_cashflow.py'
      - '.github/workflows/validate-personal-input.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  personal-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Verify canonical S01-S20 dataset unchanged
        run: echo "9e2adc5a7aa7720ef8daf24f8766389233dee399c0ea0826f9dc3a90aaeab609  app/data/source/moa_20users_financial_test_JSON.zip" | sha256sum --check -
      - name: Run personal preview contract tests and full backend regressions
        run: python -m pytest -q
