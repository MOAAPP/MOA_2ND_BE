name: One-time cleanup of merged PR branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-merged-branches-once.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only merged, unchanged, unreferenced branches
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const allClosed = await github.paginate(github.rest.pulls.list, {owner, repo, state: 'closed', per_page: 100});
            const allOpen = await github.paginate(github.rest.pulls.list, {owner, repo, state: 'open', per_page: 100});
            const openHeads = new Set(allOpen.filter(p => p.head?.repo?.full_name === `${owner}/${repo}`).map(p => p.head.ref));
            const candidates = new Map();
            for (const pr of allClosed) {
              if (!pr.merged_at || pr.base?.ref !== 'main' || pr.head?.repo?.full_name !== `${owner}/${repo}`) continue;
              const branch = pr.head.ref;
              if (!branch || branch === 'main' || openHeads.has(branch)) continue;
              if (!candidates.has(branch)) candidates.set(branch, new Set());
              candidates.get(branch).add(pr.head.sha);
            }
            let removed = 0, kept = 0;
            for (const [branch, shaSet] of candidates) {
              try {
                const current = await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
                // Never delete a branch that acquired commits after its PR was merged.
                if (!shaSet.has(current.data.object.sha)) {
                  core.info(`SKIP (branch moved after merge): ${branch}`);
                  kept++;
                  continue;
                }
                await github.rest.git.deleteRef({owner, repo, ref: `heads/${branch}`});
                core.info(`DELETED merged branch: ${branch}`);
                removed++;
              } catch (e) {
                if (e.status === 404 || e.status === 422 || e.status === 403) {
                  core.info(`SKIP (missing, protected, or forbidden): ${branch} (${e.status})`);
                  kept++;
                } else {
                  throw e;
                }
              }
            }
            core.summary.addHeading('Merged branch cleanup').addTable([
              [{data:'Deleted',header:true},{data:'Kept/skipped',header:true}],
              [String(removed),String(kept)]
            ]);
            await core.summary.write();
